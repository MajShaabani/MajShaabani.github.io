<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000814">
  <meta name="description" content="Nadia Schul — official social links.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://nadiaschul.me/">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nadia Schul">
  <meta property="og:description" content="Official social links for Nadia Schul.">
  <meta property="og:url" content="https://nadiaschul.me/">
  <title>Nadia Schul</title>
</head>
<body>
  <main class="landing-page">
    <section class="screen-frame" aria-labelledby="main-title">
      <div class="screen-label">screen</div>

      <div class="scene-grid">
        <section class="links-panel">
          <div class="pixel-card" role="region" aria-label="Official social links">
            <p class="pixel-label">official links</p>
            <h1 id="main-title">Nadia Schul</h1>
            <p class="panel-subtitle">Tap a box to open it.</p>

            <nav class="link-list" aria-label="Social media links">
              <a class="pixel-link" href="https://www.tiktok.com/@nadiaschul" target="_blank" rel="noopener noreferrer" aria-label="Open TikTok">
                <span class="link-name">TikTok</span>
              </a>

              <a class="pixel-link" href="https://www.instagram.com/nadiaschul.me/" target="_blank" rel="noopener noreferrer" aria-label="Open Instagram">
                <span class="link-name">Instagram</span>
              </a>

              <a class="pixel-link" href="https://www.pinterest.com/NadiaSchul/" target="_blank" rel="noopener noreferrer" aria-label="Open Pinterest">
                <span class="link-name">Pinterest</span>
              </a>

              <a class="pixel-link" href="mailto:contact@nadiaschul.me" aria-label="Send email to contact@nadiaschul.me">
                <span class="link-name">Email</span>
              </a>
            </nav>
          </div>
        </section>

        <aside class="nadia-panel" aria-label="Nadia panel">
          <div class="nadia-oval" aria-hidden="true">
            <span>Nadia</span>
          </div>

          <img
            class="desktop-character"
            src="./assets/nadia-pixel-character-transparent.png"
            alt="Pixel-art character of Nadia pointing toward the links"
          >

          <img
            class="mobile-character"
            src="./assets/nadia-pixel-character-mobile-up-transparent.png"
            alt="Pixel-art character of Nadia pointing upward"
          >
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
